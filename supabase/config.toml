project_id = "agent-atlas-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
# Where the React app runs (Vite default for this project).
site_url = "http://localhost:8080"
additional_redirect_urls = [
  "http://localhost:8080",
  "http://localhost:8080/**",
  "http://127.0.0.1:8080",
  "http://127.0.0.1:8080/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
# Local dev: skip email confirmation so signups work without an SMTP server.
enable_confirmations = false
double_confirm_changes = false

# Google Sign-In. Set SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID and
# SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET in your shell before `supabase start`.
# Authorized redirect URI in Google Cloud Console:
#   http://127.0.0.1:54321/auth/v1/callback
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
redirect_uri = "http://127.0.0.1:54321/auth/v1/callback"
skip_nonce_check = false